services:
  - type: web
    name: insta-downloader-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: API_AUTH_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MAX_FILE_MB
        value: "400"
      - key: RATE_LIMIT_API
        value: "30"
      - key: RATE_LIMIT_PROXY
        value: "60"
    healthCheckPath: /
    autoDeploy: true
